name: host-regression
on: [push, pull_request, workflow_call]
permissions:
  contents: read
env:
  # py's ssl in the PC programs comes from upstream mbedTLS (the firmware
  # uses ESP-IDF's copy); the Python contract test needs it.
  MBEDTLS_TAG: v3.6.7
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clang-format 16 check (tracked .c/.h outside third_party/ and the generated tables)
        run: |
          python -m pip install clang-format==16.0.6
          clang-format --version
          git ls-files -z '*.c' '*.h' ':(exclude)third_party' ':(exclude)python/gen' ':(exclude)python/qstrdefsport.h' | xargs -0 clang-format --dry-run --Werror

  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mbedTLS for ssl in py
        run: git clone --quiet --depth 1 --branch "$MBEDTLS_TAG" --recurse-submodules --shallow-submodules https://github.com/Mbed-TLS/mbedtls.git ../mbedtls-src
      - name: Configure
        run: >-
          cmake -DTDSH_BUILD_HOST=ON -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DTDSH_MBEDTLS_DIR="$(cd ../mbedtls-src && pwd)"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tdsh.exe (MinGW) and run its tests
        shell: bash
        run: |
          choco install ninja -y
          git clone --quiet --depth 1 --branch "$MBEDTLS_TAG" --recurse-submodules --shallow-submodules https://github.com/Mbed-TLS/mbedtls.git ../mbedtls-src
          cmake -S . -B build-win -G Ninja -DCMAKE_C_COMPILER=gcc -DTDSH_BUILD_HOST=ON -DTDSH_MBEDTLS_DIR="$(cd ../mbedtls-src && pwd -W)"
          cmake --build build-win
          ctest --test-dir build-win --output-on-failure --no-tests=error
