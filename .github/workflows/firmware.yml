name: firmware
on: [push, pull_request]
permissions:
  contents: read
jobs:
  generated:
    # python/gen must match its sources: regenerate it and compare.
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: The generated MicroPython tables are current
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          command -v gcc >/dev/null || (apt-get update && apt-get install -y build-essential)
          git clone --depth 1 --branch v1.29.0 https://github.com/micropython/micropython.git /tmp/mp
          git -C /tmp/mp submodule update --init lib/micropython-lib
          sh tools/micropython/gen.sh /tmp/mp
          git diff --stat --exit-code -- python/gen
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: ESP32-C6 (the repository root)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
          idf.py size
      - name: Classic ESP32 (projects/esp32)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd projects/esp32
          idf.py build
          idf.py size
      - name: ESP32-S3 (projects/esp32s3)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd projects/esp32s3
          idf.py set-target esp32s3
          idf.py build
          idf.py size
