name: release

# A tag v<version> (matching the VERSION file) builds TinyDesk Shell for the
# ESP32-C6, the classic ESP32, the ESP32-S3, Linux and Windows, and attaches the files to a draft
# pre-release: factory images (esptool at 0x0), ESP Web Tools manifests,
# the Linux and Windows programs, SHA256SUMS.txt and README.txt. Review the draft on
# GitHub, then publish it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/host.yml

  host-linux:
    needs: checks
    runs-on: ubuntu-22.04          # an older glibc: the program runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the host program
        run: |
          sudo apt-get install -y ninja-build
          cmake -S . -B build-host -G Ninja -DTDSH_BUILD_HOST=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure --no-tests=error
          strip build-host/tdsh_host
      - uses: actions/upload-artifact@v4
        with:
          name: host-linux
          path: build-host/tdsh_host

  host-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test tdsh.exe (MinGW, static)
        shell: bash
        run: |
          choco install ninja -y
          cmake -S . -B build-host -G Ninja -DCMAKE_C_COMPILER=gcc -DTDSH_BUILD_HOST=ON \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure --no-tests=error
          strip build-host/tdsh_host.exe
      - uses: actions/upload-artifact@v4
        with:
          name: host-windows
          path: build-host/tdsh_host.exe

  release:
    needs: [host-linux, host-windows]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(head -n1 VERSION | tr -d '[:space:]')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want)"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: host-linux
          path: host
      - uses: actions/download-artifact@v4
        with:
          name: host-windows
          path: host
      - name: Build the firmware (ESP32-C6, ESP32, ESP32-S3)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
          (cd projects/esp32 && idf.py build)
          (cd projects/esp32s3 && idf.py set-target esp32s3 && idf.py build)
      - name: Package
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          chmod +x host/tdsh_host
          python tools/make_release.py --host-linux host/tdsh_host --host-windows host/tdsh_host.exe
          version="$(head -n1 VERSION | tr -d '[:space:]')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The release text: RELEASE_NOTES.md with {version} filled in.
          sed "s/{version}/$version/g" RELEASE_NOTES.md > dist/release-notes.md
          if grep -q "{version}" dist/release-notes.md; then echo "::error::{version} left in the notes"; exit 1; fi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          body_path: dist/release-notes.md
          name: TinyDesk Shell ${{ env.VERSION }}
          files: |
            dist/tinydesk-shell-${{ env.VERSION }}/*.bin
            dist/tinydesk-shell-${{ env.VERSION }}/*.tar.gz
            dist/tinydesk-shell-${{ env.VERSION }}/*.zip
            dist/tinydesk-shell-${{ env.VERSION }}/manifest-*.json
            dist/tinydesk-shell-${{ env.VERSION }}/SHA256SUMS.txt
            dist/tinydesk-shell-${{ env.VERSION }}/README.txt
      - name: Keep the files of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tinydesk-shell-${{ env.VERSION }}
          path: dist/tinydesk-shell-${{ env.VERSION }}
